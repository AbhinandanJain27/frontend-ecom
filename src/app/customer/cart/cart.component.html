<h2>Shopping Cart</h2>
<div *ngIf="cartItems.length > 0; else emptyCart">
    <div class="cart">
        <div class="cart-item" *ngFor="let item of cartItems">
            <div class="product-info">
                <div class="image-name-group">
                    <div class="product-image">
                        <img [src]="item.processedImg" alt="product-image" />
                    </div>
                    <div class="product-details">
                        <div class="item-name" [ngClass]="{'highlight': item.highlighted}">
                            {{item.productName}}
                        </div>
                    </div>
                </div>
                <div class="quantity-price-group">
                    <div class="item-price">
                        {{item.price | currency : 'INR'}}
                    </div>
                    
                    <div class="quantity-controls">
                        <button mat-icon-button [disabled]="item.quantity == 1">
                            <mat-icon>remove_circle_outline</mat-icon>
                        </button>
                        <span class="quantity">{{item.quantity}}</span>
                        <button mat-icon-button>
                            <mat-icon>add_circle_outline</mat-icon>
                        </button>
                    </div>
                    
                </div>
            </div>
        </div>

        <div class="total">
            <strong>Total: {{getTotalPrice() | currency : 'INR'}}</strong>
        </div>
        <button mat-raised-button color="primary">Place Order</button>
    </div>
</div>

<ng-template #emptyCart>
    <div class="empty-cart">
        <mat-icon class="icon">remove_shopping_cart</mat-icon>
        <span>Cart Is Empty. Add Some Items to buy!</span>
    </div>
</ng-template>
